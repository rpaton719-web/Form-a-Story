<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="book.png" />
    <a href="https://www.flaticon.com/free-icons/book" title="book icons"
      >Book icons created by Magnific - Flaticon</a
    >
    <title>Form a Story</title>
  </head>
  <body>
    <section id="top">
      <img
        src="https://content.codecademy.com/courses/learn-html-forms/formAStoryLogo.svg"
        alt="Form A Story Logo"
      />
    </section>

    <section id="main">
      <h1>
        Complete the Form -<br />
        Complete the Story!
      </h1>
      <hr />
      <!--Add your form below:-->
      <form action="story.html" method="GET">
        <label for="animal-1">Animal:</label>
        <input
          id="animal-1"
          type="text"
          name="animal-1"
          required
          list="animal-1-choices"
          placeholder="e.g. dog"
          pattern="[a-zA-Z]+"
        />
        <datalist id="animal-1-choices">
          <option value="dog"></option>
          <option value="cat"></option>
          <option value="mouse"></option>
          <option value="hare"></option>
          <option value="tortoise"></option>
          <option value="tiger"></option>
          <option value="deer"></option>
        </datalist>
        <br />
        <label for="animal-2">Another Animal:</label>
        <input
          id="animal-2"
          name="animal-2"
          type="text"
          required
          list="animal-2-choices"
          placeholder="e.g. cat"
          pattern="[a-zA-Z]+"
        />
        <datalist id="animal-2-choices">
          <option value="dog"></option>
          <option value="cat"></option>
          <option value="mouse"></option>
          <option value="hare"></option>
          <option value="tortoise"></option>
          <option value="tiger"></option>
          <option value="deer"></option>
        </datalist>
        <br />
        <label for="animal-3">One More Animal:</label>
        <input
          id="animal-3"
          name="animal-3"
          type="text"
          required
          list="animal-3-choices"
          placeholder="e.g. mouse"
          pattern="[a-zA-Z]+"
        />
        <datalist id="animal-3-choices">
          <option value="dog"></option>
          <option value="cat"></option>
          <option value="mouse"></option>
          <option value="hare"></option>
          <option value="tortoise"></option>
          <option value="tiger"></option>
          <option value="deer"></option>
        </datalist>
        <br />
        <label for="adj-1">Adjective (ends in -ed):</label>
        <input
          id="adj-1"
          name="adj-1"
          type="text"
          required
          list="adj-1-choices"
          placeholder="e.g. astonished"
          pattern="[a-zA-Z]+"
        />
        <datalist id="adj-1-choices">
          <option value="bored"></option>
          <option value="tired"></option>
          <option value="excited"></option>
          <option value="confused"></option>
          <option value="disappointed"></option>
          <option value="surprised"></option>
        </datalist>
        <br />
        <label for="verb-1">Verb (ends in -ing):</label>
        <input
          id="verb-1"
          name="verb-1"
          type="text"
          required
          list="verb-1-choices"
          placeholder="e.g. laughing"
          pattern="[a-zA-Z]+"
        />
        <datalist id="verb-1-choices">
          <option value="laughing"></option>
          <option value="crying"></option>
          <option value="sleeping"></option>
          <option value="lying"></option>
          <option value="sighing"></option>
          <option value="jumping"></option>
        </datalist>
        <br />
        <label for="num-1">Number:</label>
        <input
          id="num-1"
          name="num-1"
          type="number"
          required
          placeholder="0-10"
          min="0"
          max="10"
          pattern="[0-9]+"
        />
        <br />
        <span>Yes or No:</span>
        <input id="yes" type="radio" name="answer" value="yes" required />
        <label for="yes">Yes</label>
        <input id="no" type="radio" name="answer" value="no" />
        <label for="no">No</label>
        <br />
        <label for="speed">Relative speed (ends in -er):</label>
        <select id="speed" name="speed" required>
          <option value="faster">faster</option>
          <option value="slower">slower</option>
        </select>
        <br />
        <label for="quote">Motivational Quote:</label>
        <input
          id="quote"
          name="quote"
          type="text"
          required
          list="quote-choices"
          placeholder="e.g. winner gets candy!"
        />
        <datalist id="quote-choices">
          <option value="winner gets ice cream!"></option>
          <option value="winner gets a pot of gold!"></option>
          <option value="winner gets a lifetime supply of cheese!"></option>
        </datalist>
        <br />
        <label for="message">Meaningful Message:</label>
        <textarea
          id="message"
          name="message"
          required
          rows="8"
          cols="40"
          placeholder="e.g. slow and steady wins the race!"
        ></textarea>
        <br />
        <input type="submit" value="Form My Story!" />
        <br />
      </form>
    </section>
  </body>
</html>
